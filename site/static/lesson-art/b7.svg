<text x="414" y="142" font-size="22" fill="#486257" font-weight="650" text-anchor="middle">s074</text>
<text x="580" y="109" font-size="30" fill="#1b3026" font-weight="750" text-anchor="middle">421</text>
<text x="580" y="142" font-size="22" fill="#486257" font-weight="650" text-anchor="middle">s075</text>
<text x="30" y="207" font-size="23" fill="#486257" font-weight="650" text-anchor="start">输入最大值</text>
<text x="250" y="207" font-size="24" fill="#1b3026" font-weight="750" text-anchor="middle">0.9412</text>
<text x="414" y="207" font-size="24" fill="#9d571d" font-weight="750" text-anchor="middle">3.7647</text>
<text x="580" y="207" font-size="24" fill="#1b3026" font-weight="750" text-anchor="middle">0.9216</text>
<text x="30" y="274" font-size="23" fill="#486257" font-weight="650" text-anchor="start">损失</text>
<text x="250" y="274" font-size="24" fill="#1b3026" font-weight="750" text-anchor="middle">0.23</text>
<text x="414" y="274" font-size="24" fill="#9d571d" font-weight="750" text-anchor="middle">1.41</text>
<text x="580" y="274" font-size="24" fill="#1b3026" font-weight="750" text-anchor="middle">0.24</text>
<text x="30" y="326" font-size="23" fill="#486257" font-weight="650" text-anchor="start">学习率</text>
<text x="250" y="326" font-size="24" fill="#1b3026" font-weight="750" text-anchor="middle">0.0003</text>
<text x="414" y="326" font-size="24" fill="#1b3026" font-weight="750" text-anchor="middle">0.0003</text>
<text x="580" y="326" font-size="24" fill="#1b3026" font-weight="750" text-anchor="middle">0.0003</text>
<text x="32" y="399" font-size="22" fill="#1b3026" font-weight="650" text-anchor="start">960 ÷ 255 ≈ 3.7647；按 10 位满量程除得 0.9384</text>
</g>
