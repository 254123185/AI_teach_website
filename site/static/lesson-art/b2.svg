<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
<title id="title">用空间和灰度权重核算中心灰度</title>
<desc id="desc">输入 10、10、80，左右空间权重相同，右邻灰度项约为零。空间高斯输出约 29.185，双边滤波约 10。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#486257"/></marker></defs>
<rect x="1" y="1" width="718" height="408" rx="20" fill="#fcfdf6" stroke="#c7d5c9" stroke-width="2"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="30" y="46" font-size="30" fill="#1b3026" font-weight="650" text-anchor="start">双边滤波 · 空间相邻，灰度差很大</text>
<rect x="199" y="72" width="116" height="78" rx="10" fill="#e5edf1" stroke="none" stroke-width="2"/>
<text x="257" y="101" font-size="20" fill="#486257" font-weight="650" text-anchor="middle">左邻</text>
<text x="257" y="137" font-size="30" fill="#1b3026" font-weight="750" text-anchor="middle">10</text>
<rect x="354" y="72" width="116" height="78" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<text x="412" y="101" font-size="20" fill="#486257" font-weight="650" text-anchor="middle">中心</text>
<text x="412" y="137" font-size="30" fill="#1b3026" font-weight="750" text-anchor="middle">10</text>
<rect x="508" y="72" width="116" height="78" rx="10" fill="#f7e3cc" stroke="none" stroke-width="2"/>
<text x="566" y="101" font-size="20" fill="#486257" font-weight="650" text-anchor="middle">右邻</text>
<text x="566" y="137" font-size="30" fill="#1b3026" font-weight="750" text-anchor="middle">80</text>
<text x="30" y="205" font-size="23" fill="#1b3026" font-weight="650" text-anchor="start">空间权重</text>
<text x="30" y="261" font-size="23" fill="#1b3026" font-weight="650" text-anchor="start">灰度权重</text>
<text x="30" y="321" font-size="23" fill="#1b3026" font-weight="650" text-anchor="start">相乘后</text>
<text x="257" y="205" font-size="25" fill="#38667c" font-weight="650" text-anchor="middle">0.607</text>
<text x="257" y="261" font-size="25" fill="#486257" font-weight="650" text-anchor="middle">1</text>
<rect x="200" y="286" width="114" height="49" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<text x="257" y="321" font-size="26" fill="#1b3026" font-weight="700" text-anchor="middle">0.607</text>
<text x="412" y="205" font-size="25" fill="#38667c" font-weight="650" text-anchor="middle">1</text>
<text x="412" y="261" font-size="25" fill="#486257" font-weight="650" text-anchor="middle">1</text>
<rect x="355" y="286" width="114" height="49" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<text x="412" y="321" font-size="26" fill="#1b3026" font-weight="700" text-anchor="middle">1</text>
<text x="566" y="205" font-size="25" fill="#38667c" font-weight="650" text-anchor="middle">0.607</text>
<text x="566" y="261" font-size="25" fill="#9d571d" font-weight="650" text-anchor="middle">≈ 0</text>
<rect x="509" y="286" width="114" height="49" rx="10" fill="#f7e3cc" stroke="none" stroke-width="2"/>
<text x="566" y="321" font-size="26" fill="#1b3026" font-weight="700" text-anchor="middle">≈ 0</text>
<text x="32" y="381" font-size="24" fill="#38667c" font-weight="650" text-anchor="start">只用空间权重：29.185</text>
<text x="372" y="381" font-size="24" fill="#257253" font-weight="650" text-anchor="start">用两种权重：≈ 10</text>
</g>
</svg>
