<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" role="img" aria-labelledby="title desc">
<title id="title">两个噪声标定点和独立检查点</title>
<desc id="desc">标定点分布在 0.10 和 0.80。亮度 0.40 的预测方差 0.0012，独立观测 0.0015，差值 0.0003。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#486257"/></marker></defs>
<rect x="1" y="1" width="718" height="422" rx="20" fill="#fcfdf6" stroke="#c7d5c9" stroke-width="2"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="30" y="46" font-size="30" fill="#1b3026" font-weight="650" text-anchor="start">噪声方差 · 两点拟合，第三点验收</text>
<path d="M99 307 L666 307" fill="none" stroke="#c7d5c9" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="314" font-size="17" fill="#486257" font-weight="650" text-anchor="end">0.0005</text>
<path d="M99 244 L666 244" fill="none" stroke="#c7d5c9" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="251" font-size="17" fill="#486257" font-weight="650" text-anchor="end">0.0010</text>
<path d="M99 181 L666 181" fill="none" stroke="#c7d5c9" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="188" font-size="17" fill="#486257" font-weight="650" text-anchor="end">0.0015</text>
<path d="M99 118 L666 118" fill="none" stroke="#c7d5c9" stroke-width="2" stroke-linecap="round"/>
<text x="92" y="125" font-size="17" fill="#486257" font-weight="650" text-anchor="end">0.0020</text>
<path d="M99 103 L99 320" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round"/>
<path d="M99 320 L666 320" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round"/>
<text x="165" y="350" font-size="23" fill="#486257" font-weight="650" text-anchor="middle">0.10</text>
<text x="362" y="350" font-size="23" fill="#486257" font-weight="650" text-anchor="middle">0.40</text>
<text x="625" y="350" font-size="23" fill="#486257" font-weight="650" text-anchor="middle">0.80</text>
<path d="M165 295 L625 118" fill="none" stroke="#257253" stroke-width="4" stroke-linecap="round"/>
<circle cx="165" cy="295" r="8" fill="#257253" stroke="#257253" stroke-width="3"/>
<circle cx="625" cy="118" r="8" fill="#257253" stroke="#257253" stroke-width="3"/>
<path d="M362 219 L362 181" fill="none" stroke="#9d571d" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
<circle cx="362" cy="219" r="8" fill="#fcfdf6" stroke="#257253" stroke-width="3"/>
<circle cx="362" cy="181" r="8" fill="#9d571d" stroke="#9d571d" stroke-width="3"/>
<text x="375" y="244" font-size="20" fill="#257253" font-weight="650" text-anchor="start">预测 0.0012</text>
<text x="345" y="170" font-size="22" fill="#9d571d" font-weight="650" text-anchor="end">独立 0.0015</text>
<text x="30" y="395" font-size="25" fill="#1b3026" font-weight="650" text-anchor="start">独立点相对偏差 20%，超过 15% 容差</text>
</g>
</svg>
