<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" role="img" aria-labelledby="title desc">
<title id="title">浮点到量化再读回的单张量例子</title>
<desc id="desc">本课半值远离零，0.97 读回 0.98，误差 0.01。3.20 缩放超过 127，读回 2.54，误差 0.66。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#486257"/></marker></defs>
<rect x="1" y="1" width="718" height="355" rx="20" fill="#fcfdf6" stroke="#c7d5c9" stroke-width="2"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="30" y="46" font-size="30" fill="#1b3026" font-weight="650" text-anchor="start">量化步长相同，截断的误差突变</text>
<text x="32" y="94" font-size="23" fill="#486257" font-weight="650" text-anchor="start">浮点输入</text>
<text x="32" y="223" font-size="23" fill="#486257" font-weight="650" text-anchor="start">反量化读回</text>
<rect x="198" y="65" width="124" height="54" rx="10" fill="#e5edf1" stroke="none" stroke-width="2"/>
<text x="260" y="101" font-size="29" fill="#1b3026" font-weight="760" text-anchor="middle">0.94</text>
<path d="M260 128 L260 173" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="198" y="183" width="124" height="54" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<text x="260" y="218" font-size="29" fill="#1b3026" font-weight="760" text-anchor="middle">0.94</text>
<text x="260" y="268" font-size="23" fill="#486257" font-weight="650" text-anchor="middle">q=47</text>
<rect x="367" y="65" width="124" height="54" rx="10" fill="#e5edf1" stroke="none" stroke-width="2"/>
<text x="429" y="101" font-size="29" fill="#1b3026" font-weight="760" text-anchor="middle">0.97</text>
<path d="M429 128 L429 173" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="367" y="183" width="124" height="54" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<text x="429" y="218" font-size="29" fill="#1b3026" font-weight="760" text-anchor="middle">0.98</text>
<text x="429" y="268" font-size="23" fill="#486257" font-weight="650" text-anchor="middle">q=49</text>
<rect x="539" y="65" width="124" height="54" rx="10" fill="#e5edf1" stroke="none" stroke-width="2"/>
<text x="601" y="101" font-size="29" fill="#1b3026" font-weight="760" text-anchor="middle">3.20</text>
<path d="M601 128 L601 173" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="539" y="183" width="124" height="54" rx="10" fill="#f7e3cc" stroke="none" stroke-width="2"/>
<text x="601" y="218" font-size="29" fill="#1b3026" font-weight="760" text-anchor="middle">2.54</text>
<text x="601" y="268" font-size="23" fill="#9d571d" font-weight="650" text-anchor="middle">q=127</text>
<text x="30" y="328" font-size="24" fill="#257253" font-weight="650" text-anchor="start">取整误差 0.01（0.97）</text>
<text x="384" y="328" font-size="24" fill="#9d571d" font-weight="650" text-anchor="start">截顶误差 0.66（3.20）</text>
</g>
</svg>
