<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" role="img" aria-labelledby="title desc">
<title id="title">来源组跨训练集与测试集示意</title>
<desc id="desc">同一来源 g07 的 a 原在训练集、b 原在测试集，跨集合。两张都是标错的夜景预标，但来自一个组。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#486257"/></marker></defs>
<rect x="1" y="1" width="718" height="400" rx="20" fill="#fcfdf6" stroke="#c7d5c9" stroke-width="2"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="30" y="46" font-size="30" fill="#1b3026" font-weight="650" text-anchor="start">跨集合的是同一来源 g07</text>
<text x="190" y="110" font-size="27" fill="#486257" font-weight="700" text-anchor="middle">训练集</text>
<text x="522" y="110" font-size="27" fill="#486257" font-weight="700" text-anchor="middle">测试集</text>
<rect x="46" y="126" width="298" height="194" rx="10" fill="#e5edf1" stroke="none" stroke-width="2"/>
<rect x="378" y="126" width="295" height="194" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<rect x="66" y="150" width="256" height="64" rx="10" fill="#f7e3cc" stroke="none" stroke-width="2"/>
<text x="194" y="193" font-size="25" fill="#1b3026" font-weight="700" text-anchor="middle">a · g07</text>
<rect x="398" y="150" width="256" height="64" rx="10" fill="#f7e3cc" stroke="none" stroke-width="2"/>
<text x="526" y="193" font-size="25" fill="#1b3026" font-weight="700" text-anchor="middle">b · g07</text>
<rect x="66" y="230" width="256" height="64" rx="10" fill="#fcfdf6" stroke="none" stroke-width="2"/>
<text x="194" y="273" font-size="25" fill="#1b3026" font-weight="700" text-anchor="middle">c、d · g12</text>
<rect x="398" y="230" width="256" height="64" rx="10" fill="#fcfdf6" stroke="none" stroke-width="2"/>
<text x="526" y="273" font-size="25" fill="#1b3026" font-weight="700" text-anchor="middle">e · g25、f · g36</text>
<path d="M327 182 L391 182" fill="none" stroke="#9d571d" stroke-width="5" stroke-linecap="round"/>
<text x="34" y="370" font-size="25" fill="#9d571d" font-weight="650" text-anchor="start">a、b 都被改标，但只覆盖一个独立来源组</text>
</g>
</svg>
