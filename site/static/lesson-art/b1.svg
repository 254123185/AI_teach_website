<svg xmlns="http://www.w3.org/2000/svg" width="720" height="417" viewBox="0 0 720 417" role="img" aria-labelledby="title desc">
<title id="title">一帧图像的两个因素对照</title>
<desc id="desc">旧白平衡、旧映射读数 3。只换白平衡读数 5，只换映射读数 4，两处换新读数 8。横向差值为 1 和 3。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#486257"/></marker></defs>
<rect x="1" y="1" width="718" height="415" rx="20" fill="#fcfdf6" stroke="#c7d5c9" stroke-width="2"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="32" y="46" font-size="30" fill="#1b3026" font-weight="650" text-anchor="start">同一帧 N017 · 两个模块的四格对照</text>
<text x="305" y="100" font-size="25" fill="#486257" font-weight="650" text-anchor="middle">旧映射</text>
<text x="563" y="100" font-size="25" fill="#486257" font-weight="650" text-anchor="middle">新映射</text>
<text x="30" y="179" font-size="23" fill="#486257" font-weight="650" text-anchor="start">旧白平衡</text>
<text x="30" y="324" font-size="23" fill="#486257" font-weight="650" text-anchor="start">新白平衡</text>
<rect x="230" y="118" width="150" height="76" rx="10" fill="#e5edf1" stroke="none" stroke-width="2"/>
<text x="305" y="170" font-size="38" fill="#1b3026" font-weight="750" text-anchor="middle">3</text>
<rect x="488" y="118" width="150" height="76" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<text x="563" y="170" font-size="38" fill="#1b3026" font-weight="750" text-anchor="middle">4</text>
<rect x="230" y="263" width="150" height="76" rx="10" fill="#dcecdf" stroke="none" stroke-width="2"/>
<text x="305" y="315" font-size="38" fill="#1b3026" font-weight="750" text-anchor="middle">5</text>
<rect x="488" y="263" width="150" height="76" rx="10" fill="#f7e3cc" stroke="none" stroke-width="2"/>
<text x="563" y="315" font-size="38" fill="#1b3026" font-weight="750" text-anchor="middle">8</text>
<path d="M395 155 L473 155" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="432" y="142" font-size="20" fill="#257253" font-weight="700" text-anchor="middle">+1</text>
<path d="M395 301 L473 301" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="432" y="288" font-size="20" fill="#257253" font-weight="700" text-anchor="middle">+3</text>
<path d="M305 205 L305 250" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="330" y="232" font-size="20" fill="#257253" font-weight="650" text-anchor="start">+2</text>
<path d="M563 205 L563 250" fill="none" stroke="#486257" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="588" y="232" font-size="20" fill="#257253" font-weight="650" text-anchor="start">+4</text>
<text x="35" y="388" font-size="26" fill="#1b3026" font-weight="650" text-anchor="start">同样换映射，差值从 +1 变成 +3</text>
</g>
</svg>
