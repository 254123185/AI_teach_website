<text x="518" y="94" fill="#2d694f" font-size="23" font-weight="700" text-anchor="middle">t4</text>
<text x="23" y="152" fill="#934529" font-size="21" font-weight="700" text-anchor="start">只有旧版通过</text>
<rect x="187" y="119" width="80" height="49" rx="6" fill="#f6e6d9" stroke="none" />
<text x="227" y="151" fill="#934529" font-size="23" font-weight="700" text-anchor="middle">t5</text>
