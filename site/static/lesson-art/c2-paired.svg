<text x="227" y="94" fill="#2d694f" font-size="23" font-weight="700" text-anchor="middle">t1</text>
<rect x="284" y="62" width="80" height="49" rx="6" fill="#deeee0" stroke="none" />
<text x="324" y="94" fill="#2d694f" font-size="23" font-weight="700" text-anchor="middle">t2</text>
