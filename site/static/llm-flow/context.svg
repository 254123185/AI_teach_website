<svg xmlns="http://www.w3.org/2000/svg" width="720" height="329" viewBox="0 0 720 329" role="img" aria-labelledby="title description">
<title id="title">预填充、缓存和逐词解码</title><desc id="description">整段输入预填充后留下每层的键和值。新的词元位置读取历史缓存，也把自己的键和值写入缓存。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="327" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">重复生成时，保留哪些计算结果</text><rect x="30" y="66" width="277" height="76" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="168.5" y="96" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">预填充 · Prefill</text><text x="168.5" y="119" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">并行处理输入词元</text><path d="M312 103 L398 103" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="406" y="66" width="284" height="76" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="548" y="96" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">第一次选词</text><text x="548" y="119" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">读取末位置的分数</text><path d="M167 145 L167 179" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="187" width="277" height="79" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="168.5" y="217" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">缓存每层的 K / V</text><text x="168.5" y="240" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">已有位置的键和值</text><rect x="406" y="187" width="284" height="79" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="548" y="217" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">逐词解码 · Decode</text><text x="548" y="240" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">算新位置，再写入缓存</text><path d="M616 144 L616 181" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M311 222 L399 222" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 550 188 L 550 162 L 223 162 L 223 179" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="307" font-size="19" fill="#4a6454" font-weight="500" text-anchor="start">缓存减少重复投影，仍需用当前查询读取历史键和值。</text>
</g></svg>
