<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" role="img" aria-labelledby="title description">
<title id="title">预训练、指令微调与偏好对齐</title><desc id="description">训练依次示例为下一词元、示范回答和回答偏好三种监督信号。独立评估样本不进入训练。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="286" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">不同训练阶段，使用不同监督信号</text><rect x="31" y="65" width="203" height="127" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="132.5" y="99" font-size="21" fill="#22392d" font-weight="700" text-anchor="middle">预训练</text><text x="132.5" y="132" font-size="17" fill="#22392d" font-weight="500" text-anchor="middle">语料中的下一词元</text><text x="132.5" y="164" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">学习基本语言规律</text><path d="M237 127 L254 127" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="259" y="65" width="203" height="127" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="360.5" y="99" font-size="21" fill="#22392d" font-weight="700" text-anchor="middle">指令微调 · SFT</text><text x="360.5" y="132" font-size="17" fill="#22392d" font-weight="500" text-anchor="middle">示范回答</text><text x="360.5" y="164" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">学习按指令作答</text><path d="M465 127 L482 127" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="487" y="65" width="203" height="127" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="588.5" y="99" font-size="21" fill="#22392d" font-weight="700" text-anchor="middle">偏好对齐</text><text x="588.5" y="132" font-size="17" fill="#22392d" font-weight="500" text-anchor="middle">A 比 B 更合适</text><text x="588.5" y="164" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">学习比较偏好</text><rect x="31" y="222" width="658" height="43" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="49" y="250" font-size="19" fill="#28513d" font-weight="700" text-anchor="start">独立评估集单独保留，评估样本不进入训练。</text>
</g></svg>
