<svg xmlns="http://www.w3.org/2000/svg" width="720" height="373" viewBox="0 0 720 373" role="img" aria-labelledby="title description">
<title id="title">Transformer 的 Pre-Norm 块</title><desc id="description">输入先归一化后走注意力计算，再加回输入。随后归一化并通过前馈网络，再加回注意力后的状态。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="371" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">一个 Pre-Norm Transformer 块</text><rect x="30" y="59" width="85" height="32" rx="8" fill="#d3e8d5" stroke="none" stroke-width="1.5"/><text x="72.5" y="81" font-size="16" fill="#22392d" font-weight="700" text-anchor="middle">输入 x</text><path d="M118 75 L148 75" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="156" y="55" width="164" height="41" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="238" y="82.5" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">归一化</text><path d="M324 75 L349 75" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="356" y="55" width="199" height="41" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="455.5" y="82.5" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">注意力</text><path d="M 574 75 L 618 75 L 618 125" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 71 94 L 71 142 L 588 142" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="617" cy="142" r="20" fill="#fae4bd" stroke="#b79c65" stroke-width="1.6"/><text x="617" y="149" font-size="25" fill="#22392d" font-weight="700" text-anchor="middle">+</text><text x="481" y="130" font-size="16" fill="#4a6454" font-weight="500" text-anchor="start">残差 x</text><path d="M 617 165 L 617 199 L 565 199" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="379" y="179" width="178" height="40" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="468" y="206" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">归一化</text><path d="M373 199 L349 199" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="156" y="179" width="185" height="40" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="248.5" y="206" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">前馈网络 FFN</text><path d="M 151 199 L 72 199 L 72 251" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 642 143 L 672 143 L 672 273 L 99 273" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="72" cy="273" r="20" fill="#fae4bd" stroke="#b79c65" stroke-width="1.6"/><text x="72" y="280" font-size="25" fill="#22392d" font-weight="700" text-anchor="middle">+</text><text x="486" y="260" font-size="16" fill="#4a6454" font-weight="500" text-anchor="start">残差：注意力后的状态</text><path d="M72 296 L72 316" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="323" width="154" height="32" rx="8" fill="#d3e8d5" stroke="none" stroke-width="1.5"/><text x="107" y="345" font-size="16" fill="#22392d" font-weight="700" text-anchor="middle">输出到下一层</text>
</g></svg>
