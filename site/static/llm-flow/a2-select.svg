<svg xmlns="http://www.w3.org/2000/svg" width="720" height="291" viewBox="0 0 720 291" role="img" aria-labelledby="title description">
<title id="title">基于场景的模型选择</title><desc id="description">给不同模型相同的任务和条件，盲评正确性，记录延迟和成本，再按业务要求选择。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="289" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">让不同模型跑同一批任务</text><rect x="28" y="68" width="205" height="69" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="130.5" y="98" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">固定评测样本</text><text x="130.5" y="121" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">输入、验收、权限</text><path d="M237 101 L254 101" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="259" y="68" width="202" height="69" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="360" y="98" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">同条件跑模型</text><text x="360" y="121" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">记录版本和设置</text><rect x="486" y="68" width="205" height="69" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="588.5" y="98" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">按业务约束选择</text><text x="588.5" y="121" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">准确性先过门槛</text><path d="M360 141 L360 167" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="173" width="660" height="99" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="45" y="203" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">盲评正确性</text><text x="45" y="238" font-size="16" fill="#4a6454" font-weight="500" text-anchor="start">保留失败样本</text><text x="270" y="203" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">延迟分布</text><text x="270" y="238" font-size="16" fill="#4a6454" font-weight="500" text-anchor="start">首词、P50、P95</text><text x="499" y="203" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">实际成本</text><text x="499" y="238" font-size="16" fill="#4a6454" font-weight="500" text-anchor="start">按完成任务计</text><path d="M 588 171 L 588 140" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g></svg>
