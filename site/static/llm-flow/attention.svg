<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324" role="img" aria-labelledby="title description">
<title id="title">注意力权重和因果掩码</title><desc id="description">查询与键计算分数，归一化得到对值的权重。在中间位置把未来词元的分数设为负无穷，权重归零。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="322" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">Attention 怎样给信息分配权重</text><rect x="29" y="62" width="200" height="62" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="129" y="92" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">Q · 查询</text><text x="129" y="115" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">当前位置要找什么</text><rect x="260" y="62" width="200" height="62" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="360" y="92" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">K · 键</text><text x="360" y="115" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">与查询做匹配</text><rect x="491" y="62" width="200" height="62" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="591" y="92" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">V · 值</text><text x="591" y="115" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">被加权汇总</text><text x="31" y="153" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">当前位置</text><text x="167" y="153" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">缩放后的分数</text><text x="407" y="153" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">归一化权重</text><rect x="30" y="165" width="660" height="45" rx="9" fill="#fffef8" stroke="#ccd5c6" stroke-width="1.5"/><text x="47" y="194" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">末位</text><text x="167" y="194" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">[0, 1, 2]</text><path d="M340 189 L385 189" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><text x="407" y="194" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">[0.09, 0.24, 0.67]</text><rect x="30" y="221" width="660" height="45" rx="9" fill="#d3e8d5" stroke="#a4c7aa" stroke-width="1.5"/><text x="47" y="250" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">中间位</text><text x="167" y="250" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">[0, 1, −∞]</text><path d="M340 245 L385 245" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><text x="407" y="250" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">[0.27, 0.73, 0]</text><text x="30" y="305" font-size="19" fill="#4a6454" font-weight="500" text-anchor="start">中间位看不到后一个词元，因此后者权重为 0。</text>
</g></svg>
