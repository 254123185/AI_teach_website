<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" role="img" aria-labelledby="title description">
<title id="title">从日志到证据、假设和下一步</title><desc id="description">日志中的路径读取失败是事实。目录未挂载是一个待查假设，下一步是只读检查路径和挂载。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="332" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">回答中的每一步都要能追到证据</text><rect x="30" y="62" width="660" height="44" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="45" y="90" font-size="19" fill="#28513d" font-weight="700" text-anchor="start">来源</text><text x="135" y="90" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">日志报 FileNotFoundError</text><text x="437" y="90" font-size="17" fill="#4a6454" font-weight="500" text-anchor="start">先记录原文与行号</text><path d="M 77 108 L 77 117" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="120" width="660" height="44" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="45" y="148" font-size="19" fill="#28513d" font-weight="700" text-anchor="start">事实</text><text x="135" y="148" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">指定路径读取失败</text><text x="437" y="148" font-size="17" fill="#4a6454" font-weight="500" text-anchor="start">用日志原文直接支持</text><path d="M 77 166 L 77 175" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="178" width="660" height="44" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="45" y="206" font-size="19" fill="#28513d" font-weight="700" text-anchor="start">假设</text><text x="135" y="206" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">目录可能未挂载</text><text x="437" y="206" font-size="17" fill="#4a6454" font-weight="500" text-anchor="start">读取挂载信息再判断</text><path d="M 77 224 L 77 233" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="30" y="236" width="660" height="44" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="45" y="264" font-size="19" fill="#28513d" font-weight="700" text-anchor="start">下一步</text><text x="135" y="264" font-size="19" fill="#22392d" font-weight="700" text-anchor="start">只读核对路径和挂载</text><text x="437" y="264" font-size="17" fill="#4a6454" font-weight="500" text-anchor="start">留存检查结果</text><text x="30" y="315" font-size="20" fill="#4a6454" font-weight="500" text-anchor="start">模型能提出解释。是否成立由后续检查决定。</text>
</g></svg>
