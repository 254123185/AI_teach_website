<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" role="img" aria-labelledby="title description">
<title id="title">推理的两个延迟阶段</title><desc id="description">接收请求到第一个词元是首词延迟，随后可按平均每词元时间评价解码速度。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="283" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">首词延迟和后续词元延迟</text><rect x="30" y="65" width="103" height="32" rx="8" fill="#e8ede0" stroke="none" stroke-width="1.5"/><text x="81.5" y="87" font-size="16" fill="#22392d" font-weight="700" text-anchor="middle">收到请求</text><rect x="348" y="65" width="118" height="32" rx="8" fill="#d3e8d5" stroke="none" stroke-width="1.5"/><text x="407" y="87" font-size="16" fill="#22392d" font-weight="700" text-anchor="middle">首个词元</text><rect x="570" y="65" width="118" height="32" rx="8" fill="#e8ede0" stroke="none" stroke-width="1.5"/><text x="629" y="87" font-size="16" fill="#22392d" font-weight="700" text-anchor="middle">生成结束</text><rect x="31" y="111" width="348" height="74" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="205" y="141" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">首词延迟 · TTFT</text><text x="205" y="164" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">含排队、预填充、首次选词</text><rect x="396" y="111" width="292" height="74" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="542" y="141" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">后续逐词 · TPOT</text><text x="542" y="164" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">首词之后的平均每词元时间</text><path d="M379 148 L391 148" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="31" y="213" width="657" height="50" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="48" y="245" font-size="19" fill="#4a6454" font-weight="500" text-anchor="start">预填充写入键值缓存，后续生成逐步读写缓存。</text>
</g></svg>
