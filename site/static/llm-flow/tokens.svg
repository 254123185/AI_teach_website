<svg xmlns="http://www.w3.org/2000/svg" width="720" height="329" viewBox="0 0 720 329" role="img" aria-labelledby="title description">
<title id="title">词元切分与编号</title><desc id="description">教学词表把检查、前导空格和日、志分别映射成 41、73、86。</desc>
