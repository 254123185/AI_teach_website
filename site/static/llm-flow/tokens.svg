<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="327" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="44" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">切分文字，再查词表</text><rect x="30" y="62" width="660" height="54" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="360" y="98" font-size="26" fill="#22392d" font-weight="700" text-anchor="middle">检查␠日志</text><path d="M360 117 L360 143" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="151" width="202" height="55" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="131" y="185.5" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">检查</text><path d="M131 208 L131 228" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="235" width="202" height="46" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="131" y="265" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">41</text><rect x="255" y="151" width="202" height="55" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="356" y="185.5" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">␠日</text><path d="M356 208 L356 228" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="255" y="235" width="202" height="46" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="356" y="265" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">73</text><rect x="480" y="151" width="202" height="55" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="581" y="185.5" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">志</text><path d="M581 208 L581 228" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="480" y="235" width="202" height="46" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="581" y="265" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">86</text><text x="30" y="312" font-size="20" fill="#4a6454" font-weight="500" text-anchor="start">␠ 表示普通空格。编号来自示例词表。</text>
