<svg xmlns="http://www.w3.org/2000/svg" width="720" height="279" viewBox="0 0 720 279" role="img" aria-labelledby="title description">
<title id="title">词元嵌入与位置</title><desc id="description">编号 41 查到向量，位置由序列中的索引区分。改变顺序会改变位置。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="277" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="44" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">词元编号对应一行向量</text><rect x="30" y="64" width="387" height="158" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><rect x="432" y="64" width="258" height="158" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="51" y="95" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">编号</text><text x="157" y="95" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">嵌入表中的向量</text><line x1="50" y1="107" x2="392" y2="107" stroke="#c8d4c5" stroke-width="1.5"/><rect x="48" y="117" width="344" height="31" rx="6" fill="#d3e8d5" stroke="none" stroke-width="1.5"/><text x="59" y="142" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">41</text><text x="157" y="142" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">[0.3, −0.1, 0.7]</text><text x="59" y="177" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">73</text><text x="157" y="177" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">[−0.4, 0.5, 0.1]</text><text x="59" y="212" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">86</text><text x="157" y="212" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">[0.2, 0.8, −0.3]</text><text x="561" y="103" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">同一个词元「检查」</text><rect x="454" y="119" width="213" height="36" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="560.5" y="144" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">位置 0</text><rect x="454" y="168" width="213" height="36" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="560.5" y="193" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">位置 2</text><text x="30" y="256" font-size="20" fill="#4a6454" font-weight="500" text-anchor="start">交换顺序时，初始词元嵌入不变，但位置变了。</text>
