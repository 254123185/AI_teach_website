<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-labelledby="title description">
<title id="title">语言模型的输入到输出</title><desc id="description">输入文本变成词元编号和向量，Transformer 计算下一个词元的分数，解码器选词并将其接回序列。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="324" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="44" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">从输入文字到输出文字</text><rect x="28" y="65" width="205" height="65" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="130.5" y="95" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">输入文本</text><text x="130.5" y="118" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">检查 日志</text><rect x="28" y="177" width="205" height="65" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="130.5" y="207" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">生成文本</text><text x="130.5" y="230" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">拼回字符</text><path d="M237 97 L253 97" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M253 210 L238 210" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="258" y="65" width="205" height="65" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="360.5" y="95" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">Token ID</text><text x="360.5" y="118" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">41 / 73 / 86</text><rect x="258" y="177" width="205" height="65" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="360.5" y="207" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">选下一个 ID</text><text x="360.5" y="230" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">按解码策略</text><path d="M467 97 L483 97" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M483 210 L468 210" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="488" y="65" width="205" height="65" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="590.5" y="95" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">向量表示</text><text x="590.5" y="118" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">词元 + 位置</text><rect x="488" y="177" width="205" height="65" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="590.5" y="207" font-size="20" fill="#22392d" font-weight="700" text-anchor="middle">Transformer</text><text x="590.5" y="230" font-size="16" fill="#4a6454" font-weight="500" text-anchor="middle">算下一个词元的分数</text><path d="M591 134 L591 170" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 360 247 L 360 272 L 704 272 L 704 98 L 698 98" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="375" y="305" font-size="20" fill="#28513d" font-weight="700" text-anchor="start">把新词元接回序列，继续预测</text>
</g></svg>
