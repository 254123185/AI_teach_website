<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" role="img" aria-labelledby="title description">
<title id="title">下一词元预测的训练目标</title><desc id="description">输入词元 41、73、86 的真实后继分别是 73、86、EOS。若给正确标签的概率为零点二，则损失约为一点六一。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="286" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">训练时，标签来自右移一格的文本</text><text x="32" y="91" font-size="20" fill="#28513d" font-weight="700" text-anchor="start">输入</text><text x="32" y="164" font-size="20" fill="#6e4c22" font-weight="700" text-anchor="start">标签</text><rect x="125" y="62" width="161" height="42" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="205.5" y="90" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">41</text><path d="M205 107 L205 126" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="125" y="133" width="161" height="42" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="205.5" y="161" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">73</text><rect x="312" y="62" width="161" height="42" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="392.5" y="90" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">73</text><path d="M392 107 L392 126" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="312" y="133" width="161" height="42" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="392.5" y="161" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">86</text><rect x="499" y="62" width="161" height="42" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="579.5" y="90" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">86</text><path d="M579 107 L579 126" fill="none" stroke="#6f907a" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="499" y="133" width="161" height="42" rx="12" fill="#fae4bd" stroke="#c8d4c5" stroke-width="1.5"/><text x="579.5" y="161" font-size="19" fill="#22392d" font-weight="700" text-anchor="middle">EOS</text><rect x="29" y="199" width="660" height="68" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="46" y="227" font-size="20" fill="#22392d" font-weight="700" text-anchor="start">如果模型给真实标签的概率只有 0.20，</text><text x="46" y="252" font-size="20" fill="#4a6454" font-weight="500" text-anchor="start">这一位置的损失 = −ln(0.20) ≈ 1.61。</text>
</g></svg>
