<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img" aria-labelledby="title description">
<title id="title">词元分数怎样变成生成结果</title><desc id="description">三个示例分数为 2、1、0，对应概率 0.665、0.245、0.090。选中的词元接回序列供下一步预测。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="3.8" markerHeight="3.8" orient="auto-start-reverse"><path d="M0 0 8 4 0 8z" fill="#6f907a"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, system-ui, sans-serif">
<rect x="1" y="1" width="718" height="313" rx="20" fill="#f6f7ed" stroke="#d1dbcc" stroke-width="1.5"/>
<text x="30" y="43" font-size="25" fill="#22392d" font-weight="700" text-anchor="start">分数、概率和真正选中的词元</text><text x="32" y="77" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">候选</text><text x="161" y="77" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">Logit</text><text x="295" y="77" font-size="17" fill="#4a6454" font-weight="700" text-anchor="start">Softmax 概率</text><rect x="31" y="93" width="660" height="41" rx="12" fill="#d3e8d5" stroke="#c8d4c5" stroke-width="1.5"/><text x="46" y="120" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">甲</text><text x="170" y="120" font-size="20" fill="#22392d" font-weight="500" text-anchor="start">2</text><rect x="296" y="105" width="256" height="17" rx="5" fill="#78ad87" stroke="none" stroke-width="1.5"/><text x="580" y="120" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">0.665</text><rect x="31" y="141" width="660" height="41" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="46" y="168" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">乙</text><text x="170" y="168" font-size="20" fill="#22392d" font-weight="500" text-anchor="start">1</text><rect x="296" y="153" width="95" height="17" rx="5" fill="#aec5ab" stroke="none" stroke-width="1.5"/><text x="580" y="168" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">0.245</text><rect x="31" y="189" width="660" height="41" rx="12" fill="#fffef8" stroke="#c8d4c5" stroke-width="1.5"/><text x="46" y="216" font-size="21" fill="#22392d" font-weight="700" text-anchor="start">丙</text><text x="170" y="216" font-size="20" fill="#22392d" font-weight="500" text-anchor="start">0</text><rect x="296" y="201" width="35" height="17" rx="5" fill="#aec5ab" stroke="none" stroke-width="1.5"/><text x="580" y="216" font-size="21" fill="#22392d" font-weight="500" text-anchor="start">0.090</text><rect x="31" y="250" width="660" height="47" rx="8" fill="#fae4bd" stroke="none" stroke-width="1.5"/><text x="46" y="281" font-size="20" fill="#22392d" font-weight="700" text-anchor="start">选中一个词元 → 接回序列 → 再算下一轮分数</text>
