<script>
const samples = JSON.parse(document.querySelector("#dataset").textContent);
const sampleControl = document.querySelector("#sample");
const strengthControl = document.querySelector("#strength");
const strengthLabel = document.querySelector("#strength-value");
const summary = document.querySelector("#summary");
for (const sample of samples) {
  const option = document.createElement("option");
  option.value = sample.id;
  option.textContent = sample.name;
  sampleControl.append(option);
}
function showBand(id, values) {
  document.querySelector(id).replaceChildren(...values.map(value => {
    const cell = document.createElement("div");
    cell.className = "cell";
    const swatch = document.createElement("span");
    swatch.style.backgroundColor = "rgb(" + value + ", " + value + ", " + value + ")";
    swatch.setAttribute("aria-hidden", "true");
    cell.append(swatch, String(value));
    return cell;
  }));
}
function render() {
  const sample = samples.find(item => item.id === sampleControl.value);
  const strength = Number(strengthControl.value);
  const after = sample.outputs[strength];
  const avg = values => values.reduce((a,b) => a + b, 0) / values.length;
  strengthLabel.value = strength;
  showBand("#before", sample.pixels);
  showBand("#after", after);
  const delta = avg(after) - avg(sample.pixels);
  const inverted = after.some((value, i) =>
    i > 0 && (value - after[i - 1]) * (sample.pixels[i] - sample.pixels[i - 1]) < 0);
  summary.textContent = "平均灰度变化 " + (delta > 0 ? "+" : "") + delta.toFixed(2)
    + (inverted ? " · 检测到相邻灰度倒序" : " · 未观察到相邻灰度倒序");
}
sampleControl.addEventListener("change", render);
strengthControl.addEventListener("input", render);
render();
</script>
